name: Retrain Attention-LSTM

# Weekly retraining: Sunday 06:00 UTC (markets closed, fresh Friday data available).
# Also runnable on-demand from the Actions tab.
on:
  schedule:
    - cron: "0 6 * * 0"
  workflow_dispatch:
    inputs:
      reason:
        description: "Why are we retraining manually?"
        required: false
        default: "manual retrain"

permissions:
  contents: write   # needed to commit the regenerated model artefacts

concurrency:
  # Never let two retrains race each other.
  group: lstm-retrain
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # We need a full token so the commit push can trigger downstream
          # deploy hooks (Vercel). The default GITHUB_TOKEN is fine for that.
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements-train.txt

      - name: Install training deps
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements-train.txt

      - name: Run training + validation gate
        id: train
        working-directory: backend
        env:
          TF_CPP_MIN_LOG_LEVEL: "2"       # suppress TF info chatter
          TF_USE_LEGACY_KERAS: "1"
        run: |
          python scripts/train_lstm.py

      - name: Check if model artefacts changed
        id: diff
        run: |
          git add -N frontend/public/models/lstm/
          if git diff --quiet frontend/public/models/lstm/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Model output is byte-identical — nothing to commit."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Model artefacts changed — committing."
          fi

      - name: Commit + push new model
        if: steps.diff.outputs.changed == 'true'
        run: |
          git config user.name  "qwant-retrain-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add frontend/public/models/lstm/
          git commit -m "chore(lstm): weekly retrain $(date -u +%Y-%m-%d)

          Automated retrain via .github/workflows/retrain-lstm.yml.
          Passed validation gate (OOS MSE, dir accuracy, rollout survivors)."
          git push

      - name: Summary
        if: always()
        run: |
          echo "### LSTM retrain summary" >> "$GITHUB_STEP_SUMMARY"
          echo "- Model changed: ${{ steps.diff.outputs.changed }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- Reason: ${{ github.event.inputs.reason || 'scheduled' }}" >> "$GITHUB_STEP_SUMMARY"
