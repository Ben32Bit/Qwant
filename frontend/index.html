<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Portfolio Backtester — AI-Powered Backtesting</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <!-- onnxruntime-web loaded from CDN so Vite/Rollup doesn't try to bundle WASM.
         Pinned to 1.22.0 — supports ai.onnx opset 22 / IR v10 that skl2onnx's
         current default export produces. 1.20.x throws raw WASM memory pointers
         (e.g. "XGBoost: 8667456") when asked to load IR v10 models. -->
    <script src="https://cdn.jsdelivr.net/npm/onnxruntime-web@1.22.0/dist/ort.min.js"></script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
